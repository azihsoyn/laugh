[package]
name = "laugh"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "The GitHub you'd want in a terminal: every review thread including resolved ones, and the changed files with their Viewed state — for one pull request or a related set across repositories"
license = "MIT"
repository = "https://github.com/azihsoyn/laugh"
homepage = "https://github.com/azihsoyn/laugh"
readme = "README.md"
keywords = ["github", "pull-request", "review", "tui", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
unicode-width = "0.2"
