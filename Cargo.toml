[package]
name = "laugh"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
description = "Review a GitHub pull request without leaving the terminal: every review thread including resolved ones, Viewed state for the changed files, CI failures with their logs, and a reading order"
license = "MIT"
repository = "https://github.com/azihsoyn/laugh"
homepage = "https://github.com/azihsoyn/laugh"
readme = "README.md"
keywords = ["github", "pull-request", "review", "tui", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["demo.gif", "demo.tape", ".github/", "dist-workspace.toml"]

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive"] }
crossterm = "0.29.0"
http = "1"
opentelemetry = { version = "0.33", default-features = false, features = ["trace"] }
opentelemetry-http = { version = "0.33", default-features = false }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "std"] }
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tracing = "0.1.44"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "env-filter", "std", "registry", "ansi"] }
unicode-width = "0.2"

[profile.dist]
inherits = "release"
lto = "thin"
